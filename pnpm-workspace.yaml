packages:
  - 'packages/*'
# Flat node_modules (som yarn workspaces), samme som i de andre familie-repoene
# som er migrert til pnpm. Storybook/webpack-oppsettet og pakkene resolver da
# som før migreringen.
nodeLinker: hoisted
# Workspace-pakker lenkes lokalt når versjonen matcher (som yarn 1 gjorde).
# pnpm ≥ 9 har dette avslått som standard og ville ellers hentet f.eks.
# @navikt/familie-typer fra GitHub Packages i stedet for fra packages/.
linkWorkspacePackages: true
# … og foretrekkes framfor registeret selv om registeret har en nyere versjon
# som også passer rangen (yarn 1 lenket alltid; pnpm velger ellers registeret
# ved en vanlig 'pnpm install' på en branch som ligger bak main).
preferWorkspacePackages: true
# Nye avhengigheter pinnes eksakt (pnpm 11 leser bare auth/registry fra .npmrc,
# så save-exact der har ingen effekt — tilsvarer 'save-exact true' i .yarnrc).
saveExact: true
# Tilsvarer 'resolutions' i package.json under yarn.
overrides:
  csstype: 3.1.2
# Avhengigheter får ikke kjøre (pre|post)install-scripts (sikkerhetstiltak).
# Tilsvarer 'ignore-scripts true' i .yarnrc for avhengighetene. Merk: yarn
# hoppet også over repoets eget prepare-script (husky), så pre-commit-hooken
# har vært inaktiv lokalt; med pnpm kjører prepare, og hooken er aktiv igjen.
# NB: en ny avhengighet med
# install-script gjør at 'pnpm install' feiler med ERR_PNPM_IGNORED_BUILDS og
# skriver en ugyldig placeholder inn i denne fila — erstatt den med
# 'pakke: false' (eller 'true' for å tillate scriptet).
allowBuilds:
  '@swc/core': false
  esbuild: false
  nx: false
# Egne pakker fra GitHub Packages tas i bruk med en gang (pnpm venter ellers
# minimumReleaseAge, som standard 1 dag, før nye versjoner installeres).
minimumReleaseAgeExclude:
  - '@navikt/*'
  - '@nais/*'
